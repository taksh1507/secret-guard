name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Coverage report
        if: matrix.python-version == '3.13'
        run: |
          pip install coverage
          coverage run -m unittest discover -s tests
          coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Smoke test
        run: |
          cd "$RUNNER_TEMP"
          printf "API_KEY = 'AKIA%s'\n" "IOSFODNN7EXAMPLE" > smoke.py
          if secret-guard scan --no-entropy . >/dev/null 2>&1; then
            echo "expected the scanner to fail, but it passed" >&2
            exit 1
          fi
          echo "smoke test passed: scanner detected the seeded secret"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ruff
      - name: Ruff check
        run: ruff check secretguard tests