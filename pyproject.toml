[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-guard-scan"
version = "0.7.0"
description = "Scan your codebase for hardcoded secrets before they get committed."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "secrets", "scanner", "ci", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/taksh1507/secret-guard"
Repository = "https://github.com/taksh1507/secret-guard"
Documentation = "https://github.com/taksh1507/secret-guard#readme"
Issues = "https://github.com/taksh1507/secret-guard/issues"

[project.scripts]
secret-guard = "secretguard.cli:main"

[tool.setuptools.packages.find]
include = ["secretguard*"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "UP", "PL", "I"]

[tool.ruff.lint.pylint]
max-args = 7